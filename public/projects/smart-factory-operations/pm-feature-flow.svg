<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Preventive maintenance feature flow</title>
  <desc id="desc">Preventive maintenance starts from PM type and checklist, maps machines, creates plans, records inspection, and reports OK or NG results.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
  </defs>
  <rect width="1200" height="640" rx="28" fill="url(#bg)"/>
  <text x="70" y="76" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">Preventive Maintenance Flow</text>
  <text x="70" y="112" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#475569">Turn repeated maintenance knowledge into planned inspections and traceable OK / NG results.</text>
  <g filter="url(#shadow)">
    <rect x="60" y="225" width="140" height="118" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="130" y="268" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#0f172a">PM Type</text>
    <text x="130" y="299" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b">Frequency and</text>
    <text x="130" y="319" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b">maintenance type</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="235" y="225" width="140" height="118" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="305" y="268" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#0f172a">Checklist</text>
    <text x="305" y="299" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b">Inspection items</text>
    <text x="305" y="319" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b">and criteria</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="410" y="225" width="140" height="118" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="480" y="268" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#0f172a">Mapping</text>
    <text x="480" y="299" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b">Apply PM type</text>
    <text x="480" y="319" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b">to machines</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="585" y="225" width="140" height="118" rx="16" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
    <text x="655" y="268" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#0f172a">PM Plan</text>
    <text x="655" y="299" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b">Due date and</text>
    <text x="655" y="319" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b">assignee</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="760" y="225" width="140" height="118" rx="16" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
    <text x="830" y="268" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#0f172a">Inspection</text>
    <text x="830" y="299" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b">Technician fills</text>
    <text x="830" y="319" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b">checklist result</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="935" y="155" width="170" height="105" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="1020" y="199" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#0f172a">OK Report</text>
    <text x="1020" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b">Completed PM</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="935" y="350" width="170" height="105" rx="16" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
    <text x="1020" y="394" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#0f172a">NG Report</text>
    <text x="1020" y="425" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b">Abnormal item</text>
  </g>
  <path d="M200 284 H235" stroke="#10b981" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M375 284 H410" stroke="#10b981" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M550 284 H585" stroke="#10b981" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M725 284 H760" stroke="#10b981" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M900 284 C925 284 920 207 935 207" stroke="#10b981" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M900 284 C925 284 920 402 935 402" stroke="#ef4444" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <rect x="72" y="500" width="1056" height="64" rx="18" fill="#064e3b"/>
  <text x="600" y="538" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Value: maintenance becomes planned, checklist-based, and measurable by machine.</text>
</svg>
