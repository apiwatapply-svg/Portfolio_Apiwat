<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Development workflow for Smart Factory Operations Platform</title>
  <desc id="desc">Development workflow includes Git branch, frontend, backend API, MSSQL, Socket.IO, E2E capture, CI/CD, and release.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7"/>
    </marker>
  </defs>
  <rect width="1200" height="640" rx="28" fill="url(#bg)"/>
  <text x="70" y="76" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">Development Workflow</text>
  <text x="70" y="112" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#475569">A repeatable path from feature branch to verified release, replacing manual copy-and-paste deployment.</text>
  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="70" y="225" width="125" height="110" rx="16" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
    <text x="132" y="268" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">Git Branch</text>
    <text x="132" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">Small scope</text>
    <rect x="240" y="225" width="125" height="110" rx="16" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
    <text x="302" y="268" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">Frontend</text>
    <text x="302" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">Role screens</text>
    <rect x="410" y="225" width="125" height="110" rx="16" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
    <text x="472" y="268" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">API</text>
    <text x="472" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">Business rules</text>
    <rect x="580" y="225" width="125" height="110" rx="16" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
    <text x="642" y="268" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">MSSQL</text>
    <text x="642" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">Data checks</text>
    <rect x="750" y="225" width="125" height="110" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="812" y="268" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">Socket.IO</text>
    <text x="812" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">Realtime event</text>
    <rect x="920" y="225" width="125" height="110" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="982" y="268" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">E2E</text>
    <text x="982" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">Browser proof</text>
    <rect x="325" y="420" width="160" height="105" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="405" y="462" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">CI/CD</text>
    <text x="405" y="492" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">Build and deploy</text>
    <rect x="715" y="420" width="160" height="105" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="795" y="462" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">Release</text>
    <text x="795" y="492" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">Factory update</text>
  </g>
  <path d="M195 280 H240" stroke="#0284c7" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M365 280 H410" stroke="#0284c7" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M535 280 H580" stroke="#0284c7" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M705 280 H750" stroke="#0284c7" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M875 280 H920" stroke="#0284c7" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M982 335 C982 395 405 365 405 420" stroke="#0284c7" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M485 472 H715" stroke="#0284c7" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <rect x="72" y="545" width="1056" height="54" rx="18" fill="#0c4a6e"/>
  <text x="600" y="578" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff">Result: deployment effort reduced from 150 minutes to 15 minutes per release.</text>
</svg>
