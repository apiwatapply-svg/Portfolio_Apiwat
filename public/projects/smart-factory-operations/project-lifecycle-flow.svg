<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Project lifecycle from requirements to deploy</title>
  <desc id="desc">The project lifecycle starts with shopfloor observation, requirements interviews, current workflow mapping, design, prototype, E2E testing, CI/CD deployment, and feedback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
  </defs>
  <rect width="1200" height="640" rx="28" fill="url(#bg)"/>
  <text x="70" y="76" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">From Shopfloor Requirements to Deployment</text>
  <text x="70" y="112" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#475569">A practical workflow for building factory software when production time is limited.</text>
  <g font-family="Inter, Arial, sans-serif" filter="url(#shadow)">
    <rect x="70" y="180" width="160" height="95" rx="16" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <text x="150" y="221" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">Observe</text>
    <text x="150" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">Shopfloor work</text>
    <rect x="290" y="180" width="160" height="95" rx="16" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <text x="370" y="221" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">Interview</text>
    <text x="370" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">Production, QC, MM</text>
    <rect x="510" y="180" width="160" height="95" rx="16" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <text x="590" y="221" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">Map Flow</text>
    <text x="590" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">Current process</text>
    <rect x="730" y="180" width="160" height="95" rx="16" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
    <text x="810" y="221" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">Design</text>
    <text x="810" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">DB, API, status</text>
    <rect x="950" y="180" width="160" height="95" rx="16" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
    <text x="1030" y="221" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">Prototype</text>
    <text x="1030" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">Real screen flow</text>
    <rect x="180" y="375" width="160" height="95" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="260" y="416" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">E2E Test</text>
    <text x="260" y="445" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">124 evidence shots</text>
    <rect x="440" y="375" width="160" height="95" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="520" y="416" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">Git CI/CD</text>
    <text x="520" y="445" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">Controlled release</text>
    <rect x="700" y="375" width="160" height="95" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="780" y="416" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">Deploy</text>
    <text x="780" y="445" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">Factory PCs/server</text>
    <rect x="960" y="375" width="160" height="95" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="1040" y="416" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">Feedback</text>
    <text x="1040" y="445" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">Improve next sprint</text>
  </g>
  <path d="M230 228 H290" stroke="#6366f1" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M450 228 H510" stroke="#6366f1" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M670 228 H730" stroke="#6366f1" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M890 228 H950" stroke="#6366f1" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M1030 275 C1030 330 260 320 260 375" stroke="#6366f1" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M340 423 H440" stroke="#6366f1" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M600 423 H700" stroke="#6366f1" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M860 423 H960" stroke="#6366f1" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <rect x="72" y="535" width="1056" height="54" rx="18" fill="#312e81"/>
  <text x="600" y="568" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff">Key lesson: observe real work first, then ask focused questions when people are busy.</text>
</svg>
