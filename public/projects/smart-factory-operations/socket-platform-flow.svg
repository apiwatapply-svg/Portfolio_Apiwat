<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Cross module Socket.IO data flow</title>
  <desc id="desc">Admin master data, MSSQL Server, backend API, Socket.IO, MMS, Job Request, PM, and Tooling Store share data across the platform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f97316"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7"/>
    </marker>
  </defs>
  <rect width="1200" height="640" rx="28" fill="url(#bg)"/>
  <text x="70" y="76" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">Platform Data Integration with Socket.IO</text>
  <text x="70" y="112" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#475569">Each feature has its own workflow, but all modules read shared master data and update users through the same platform layer.</text>
  <g filter="url(#shadow)">
    <rect x="70" y="250" width="175" height="125" rx="16" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
    <text x="157" y="292" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Admin Master</text>
    <text x="157" y="324" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b">Area, type,</text>
    <text x="157" y="346" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b">machine, users</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="310" y="250" width="175" height="125" rx="16" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
    <text x="397" y="292" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#0f172a">MSSQL Server</text>
    <text x="397" y="324" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b">Source of truth</text>
    <text x="397" y="346" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b">for all modules</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="550" y="250" width="175" height="125" rx="16" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
    <text x="637" y="292" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Backend API</text>
    <text x="637" y="324" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b">REST endpoints</text>
    <text x="637" y="346" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b">and business rules</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="790" y="250" width="175" height="125" rx="16" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
    <text x="877" y="292" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Socket.IO</text>
    <text x="877" y="324" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b">Realtime events</text>
    <text x="877" y="346" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b">for operation screens</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1015" y="110" width="135" height="85" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="1082" y="160" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a">MMS</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1015" y="230" width="135" height="85" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="1082" y="280" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Job Request</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1015" y="350" width="135" height="85" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="1082" y="400" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a">PM</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1015" y="470" width="135" height="85" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="1082" y="520" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Tooling</text>
  </g>
  <path d="M245 312 H310" stroke="#f97316" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M485 312 H550" stroke="#f97316" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M725 312 H790" stroke="#0284c7" stroke-width="5" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M965 312 C1000 312 990 152 1015 152" stroke="#0284c7" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M965 312 C1000 312 990 272 1015 272" stroke="#0284c7" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M965 312 C1000 312 990 392 1015 392" stroke="#0284c7" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M965 312 C1000 312 990 512 1015 512" stroke="#0284c7" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
  <rect x="72" y="510" width="790" height="58" rx="18" fill="#0f172a"/>
  <text x="467" y="546" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff">Shared data keeps departments aligned: Production, Maintenance, QC, PM, and Tooling.</text>
</svg>
