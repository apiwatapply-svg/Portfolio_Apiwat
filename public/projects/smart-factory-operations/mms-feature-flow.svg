<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">MMS feature data flow</title>
  <desc id="desc">Machine status flows from PLC and collector into SQL Server, dashboards, GOT event panel, reports, and realtime Socket.IO updates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0ea5e9"/>
    </marker>
  </defs>
  <rect width="1200" height="640" rx="28" fill="url(#bg)"/>
  <g opacity="0.45" stroke="#cbd5e1" stroke-width="1">
    <path d="M80 120 H1120"/>
    <path d="M80 240 H1120"/>
    <path d="M80 360 H1120"/>
    <path d="M80 480 H1120"/>
    <path d="M200 70 V570"/>
    <path d="M400 70 V570"/>
    <path d="M600 70 V570"/>
    <path d="M800 70 V570"/>
    <path d="M1000 70 V570"/>
  </g>
  <text x="70" y="76" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">MMS Flow: Machine Status to Dashboard and Reports</text>
  <text x="70" y="112" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#475569">Realtime visibility plus historical analysis for machine operation.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="205" width="160" height="130" rx="16" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
    <text x="150" y="248" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#0f172a">PLC / Machine</text>
    <text x="150" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b">Status, output,</text>
    <text x="150" y="304" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b">alarm, downtime</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="285" y="205" width="160" height="130" rx="16" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
    <text x="365" y="248" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Collector</text>
    <text x="365" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b">PC service reads</text>
    <text x="365" y="304" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b">machine events</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="500" y="205" width="160" height="130" rx="16" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
    <text x="580" y="248" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#0f172a">MSSQL</text>
    <text x="580" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b">Machine hourly</text>
    <text x="580" y="304" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b">history rows</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="715" y="130" width="170" height="130" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="800" y="173" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#0f172a">MMS Overview</text>
    <text x="800" y="207" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b">Live machine</text>
    <text x="800" y="229" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b">operation view</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="715" y="330" width="170" height="130" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="800" y="373" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#0f172a">GOT Event Panel</text>
    <text x="800" y="407" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b">RUN, STOP, QC,</text>
    <text x="800" y="429" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b">ALARM events</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="950" y="130" width="180" height="130" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="1040" y="173" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Socket.IO</text>
    <text x="1040" y="207" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b">Push realtime</text>
    <text x="1040" y="229" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b">status changes</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="950" y="330" width="180" height="130" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="1040" y="373" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Reports</text>
    <text x="1040" y="407" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b">Graph, table,</text>
    <text x="1040" y="429" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b">export review</text>
  </g>
  <path d="M230 270 H285" stroke="#0ea5e9" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M445 270 H500" stroke="#0ea5e9" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M660 270 C690 270 690 195 715 195" stroke="#0ea5e9" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M660 270 C690 270 690 395 715 395" stroke="#0ea5e9" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M885 195 H950" stroke="#0ea5e9" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M885 395 H950" stroke="#0ea5e9" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <rect x="70" y="520" width="1060" height="58" rx="18" fill="#0f172a"/>
  <text x="600" y="556" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Purpose: make machine status visible now, then use history for analysis and improvement.</text>
</svg>
